site_name: MkDocs-Kit Documentation
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: slate          # Dark mode (default)
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default        # Light mode
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand

plugins:
  - search

nav:
  - Home: index.md
  - User Manual: user_manual.md
  - Diagram Guide: diagram_guide.md
  - Diagrams:
    - CSV Tables: diagrams/csv.md
    - Plotly Charts: diagrams/plotly.md
    - D3.js Diagrams: diagrams/d3.md
    - PlantUML: diagrams/plantuml.md
    - WireViz: diagrams/wireviz.md
    - RackDiag: diagrams/rackdiag.md
    - PacketDiag: diagrams/packetdiag.md
    - ByteField: diagrams/bytefield.md
    - BlockDiag: diagrams/blockdiag.md
    - NwDiag: diagrams/nwdiag.md
  - Capabilities Analysis: capabilities.md
