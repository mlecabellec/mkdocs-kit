name: Build and Package (Gitea)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian-12
            pkg_type: deb
          - os: debian-13
            pkg_type: deb
          - os: fedora
            pkg_type: rpm
          - os: archlinux
            pkg_type: arch

    steps:
      - name: Install Node.js, Git, and CA certificates (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: |
          apt-get update && apt-get install -y --no-install-recommends nodejs git ca-certificates

      - name: Install Node.js, Git, and CA certificates (Arch Linux)
        if: matrix.os == 'archlinux'
        run: |
          pacman -Sy --noconfirm nodejs git ca-certificates

      - name: Install Node.js, Git, and CA certificates (Fedora)
        if: matrix.os == 'fedora'
        run: |
          dnf install -y nodejs git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          github-server-url: https://gitea2.lecabellec.fr

      - name: Install dependencies (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            tar \
            gzip \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-setuptools \
            python3-wheel \
            build-essential \
            graphviz \
            plantuml \
            default-jre-headless \
            curl \
            libcairo2-dev \
            libpango1.0-dev \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            shared-mime-info

      - name: Install dependencies (Fedora)
        if: matrix.os == 'fedora'
        run: |
          dnf install -y \
            tar \
            gzip \
            python3 \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            gcc \
            gcc-c++ \
            make \
            findutils \
            graphviz \
            plantuml \
            cairo-devel \
            pango-devel \
            gdk-pixbuf2-devel \
            libffi-devel \
            libxml2-devel \
            libxslt-devel \
            shared-mime-info \
            rpm-build \
            curl

      - name: Install dependencies (Arch Linux)
        if: matrix.os == 'archlinux'
        run: |
          pacman -Syu --needed --noconfirm \
            tar \
            gzip \
            python \
            python-pip \
            python-setuptools \
            python-wheel \
            base-devel \
            graphviz \
            plantuml \
            cairo \
            pango \
            gdk-pixbuf2 \
            libxml2 \
            libxslt \
            shared-mime-info \
            sudo \
            curl

      - name: Prepare bundled PlantUML and JRE
        shell: bash
        run: |
          mkdir -p src/mkdocs_kit/bundled/plantuml
          if [ ! -f src/mkdocs_kit/bundled/plantuml/plantuml.jar ]; then
            curl -fsSL -o src/mkdocs_kit/bundled/plantuml/plantuml.jar "https://github.com/plantuml/plantuml/releases/download/v1.2024.6/plantuml-asl-1.2024.6.jar" || true
          fi
          if command -v jlink >/dev/null 2>&1; then
            mkdir -p src/mkdocs_kit/bundled/jre
            jlink --add-modules java.base,java.desktop,java.logging,java.xml,jdk.unsupported \
                  --strip-debug --no-man-pages --no-header-files --compress=2 \
                  --output src/mkdocs_kit/bundled/jre || true
          fi

      - name: Build standalone binary
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install pyinstaller
          pip install -e .
          pyinstaller mkdocs-kit.spec

      - name: Run unit tests
        shell: bash
        run: |
          source .venv/bin/activate
          python3 -m unittest discover -s tests

      - name: Test precompiled binary
        run: |
          ./dist/mkdocs-kit --help

      - name: Create Debian Package
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: |
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/bin
          cp dist/mkdocs-kit pkg/usr/bin/
          cp packaging/debian/control pkg/DEBIAN/
          chmod 755 pkg/usr/bin/mkdocs-kit
          chmod 644 pkg/DEBIAN/control
          chown -R root:root pkg/
          dpkg-deb --build pkg mkdocs-kit_1.0.0-1_${{ matrix.os }}_amd64.deb

      - name: Create Arch Linux Package
        if: matrix.os == 'archlinux'
        run: |
          cp dist/mkdocs-kit packaging/arch/
          useradd -m builduser
          passwd -d builduser
          printf 'builduser ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builduser
          chown -R builduser:builduser packaging/arch
          cd packaging/arch
          sudo -u builduser makepkg --nodeps --cleanbuild
          mv mkdocs-kit-1.0.0-1-x86_64.pkg.tar.zst ../../mkdocs-kit_1.0.0-1_archlinux.pkg.tar.zst

      - name: Create Fedora Package
        if: matrix.os == 'fedora'
        run: |
          mkdir -p output
          rpmbuild --define "_sourcedir $PWD/dist" \
                   --define "_rpmdir $PWD/output" \
                   -bb packaging/fedora/mkdocs-kit.spec
          find output -name "*.rpm" -exec cp {} . \;

      - name: Install and test generated package (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: |
          apt-get install -y --no-install-recommends ./mkdocs-kit_1.0.0-1_${{ matrix.os }}_amd64.deb
          mkdocs-kit --help

      - name: Install and test generated package (Arch Linux)
        if: matrix.os == 'archlinux'
        run: |
          pacman -U --noconfirm mkdocs-kit_1.0.0-1_archlinux.pkg.tar.zst
          mkdocs-kit --help

      - name: Install and test generated package (Fedora)
        if: matrix.os == 'fedora'
        run: |
          dnf install -y ./mkdocs-kit-1.0.0-1.*.rpm
          mkdocs-kit --help

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mkdocs-kit-${{ matrix.os }}
          path: |
            *.deb
            *.pkg.tar.zst
            *.rpm
