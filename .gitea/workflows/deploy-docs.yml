name: Build & Publish Documentation (Gitea)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Documentation Site & PDF Manual
    runs-on: ubuntu-latest
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')

    steps:
      - name: "Diagnostic: Environment & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          echo "=== Host / Container OS ==="
          cat /etc/os-release 2>/dev/null || true
          uname -a
          id
          pwd
          df -h . || true
          echo "=== Runner Context ==="
          printf '%s\n' "$CTX_RUNNER"
          echo "=== Strategy / Matrix Context ==="
          printf '%s\n' "$CTX_STRATEGY"
          printf '%s\n' "$CTX_MATRIX"
          echo "=== Gitea Context (token redacted) ==="
          printf '%s\n' "$CTX_GITEA" | sed 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: "Diagnostic: Workspace & Toolchain Check"
        run: |
          echo "=== Workspace Files ==="
          ls -la
          if [ -d .git ]; then
            git status -sb || true
            git remote -v || true
            git log -1 --oneline || true
          fi
          echo "=== Available Tools ==="
          for cmd in node git python3 cmake gcc g++ make java mvn podman docker curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf "%-10s %s\n" "$cmd:" "$(command -v "$cmd")"
            else
              printf "%-10s missing\n" "$cmd:"
            fi
          done

      - name: Install System Dependencies
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            plantuml \
            graphviz \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            default-jre-headless \
            libxml2-dev \
            libxslt1-dev \
            curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Prepare bundled PlantUML
        run: |
          mkdir -p src/mkdocs_kit/bundled/plantuml
          curl -fsSL -o src/mkdocs_kit/bundled/plantuml/plantuml.jar "https://github.com/plantuml/plantuml/releases/download/v1.2024.6/plantuml-asl-1.2024.6.jar" || true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install -e .

      - name: Build Documentation
        run: |
          cd doc
          python3 ../src/mkdocs_kit/cli.py build

      - name: Upload Documentation Site Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mkdocs-kit-docs-site
          path: doc/site/

      - name: Upload PDF Manual Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mkdocs-kit-docs-pdf
          path: doc/documentation.pdf

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          df -h . || true
          ls -la
