name: Build & Publish Documentation (Gitea)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Documentation Site & PDF Manual
    runs-on: ubuntu-latest
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')

    steps:
      - name: Checkout Repository
        shell: bash
        env:
          GITEA_TOKEN: ${{ gitea.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://gitea2.lecabellec.fr/${{ gitea.repository }}.git"
          if [ -n "${GITEA_TOKEN:-}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://gitea2.lecabellec.fr/.extraheader=Authorization: Basic ${AUTH_B64}" \
              fetch --no-tags --prune --depth=1 origin "${{ gitea.ref }}"
          else
            git fetch --no-tags --prune --depth=1 origin "${{ gitea.ref }}"
          fi
          git checkout --force "${{ gitea.sha }}" 2>/dev/null || git checkout --force FETCH_HEAD

      - name: Install System Dependencies
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            plantuml \
            graphviz \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            default-jre-headless \
            libxml2-dev \
            libxslt1-dev \
            curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Prepare bundled PlantUML
        run: |
          mkdir -p src/mkdocs_kit/bundled/plantuml
          curl -fsSL -o src/mkdocs_kit/bundled/plantuml/plantuml.jar "https://github.com/plantuml/plantuml/releases/download/v1.2024.6/plantuml-asl-1.2024.6.jar" || true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install -e .

      - name: Build Documentation
        run: |
          cd doc
          python3 ../src/mkdocs_kit/cli.py build

      - name: Upload Documentation Site Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mkdocs-kit-docs-site
          path: doc/site/

      - name: Upload PDF Manual Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mkdocs-kit-docs-pdf
          path: doc/documentation.pdf
