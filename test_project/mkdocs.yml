site_name: My Documentation Kit
use_directory_urls: false
theme:
  name: material
  palette:
    - scheme: slate          # Dark mode (default)
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default        # Light mode
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

plugins:
  - search

nav:
  - Home: index.md
  - Data Tables: data_tables/csv.md
  - Plotly Charts: charts/plotly.md
  - D3 Visualizations: charts/d3.md
  - UML Diagrams: uml/plantuml.md
  - Hardware & Cabling: hardware/wireviz.md
  - Infrastructure: infrastructure/rackdiag.md
  - Networking: network/packetdiag.md
  - Data Structures: electronics/bytefield.md
