name: Build and Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: bookworm
            container: debian:bookworm
            pkg_type: deb
          - dist: trixie
            container: debian:trixie
            pkg_type: deb
          - dist: archlinux
            container: archlinux:latest
            pkg_type: arch
          - dist: fedora
            container: fedora:latest
            pkg_type: rpm

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Install git, tar, gzip (Debian)
        if: matrix.pkg_type == 'deb'
        run: |
          apt-get update
          apt-get install -y git tar gzip

      - name: Install git, tar, gzip (Fedora)
        if: matrix.pkg_type == 'rpm'
        run: |
          dnf install -y git tar gzip

      - name: Install git, tar, gzip (Arch Linux)
        if: matrix.pkg_type == 'arch'
        run: |
          pacman -Syu --needed --noconfirm git tar gzip

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Debian)
        if: matrix.pkg_type == 'deb'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 \
            python3-pip \
            python3-venv \
            python3-setuptools \
            python3-wheel \
            build-essential \
            graphviz \
            plantuml \
            libcairo2-dev \
            libpango1.0-dev \
            libffi-dev \
            shared-mime-info

      - name: Install dependencies (Fedora)
        if: matrix.pkg_type == 'rpm'
        run: |
          dnf install -y \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            gcc \
            gcc-c++ \
            make \
            findutils \
            graphviz \
            plantuml \
            cairo-devel \
            pango-devel \
            gdk-pixbuf2-devel \
            libffi-devel \
            shared-mime-info \
            rpm-build

      - name: Install dependencies (Arch Linux)
        if: matrix.pkg_type == 'arch'
        run: |
          pacman -Syu --needed --noconfirm \
            python \
            python-pip \
            python-setuptools \
            python-wheel \
            base-devel \
            graphviz \
            plantuml \
            cairo \
            pango \
            gdk-pixbuf2 \
            shared-mime-info \
            sudo

      - name: Build standalone binary
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install mkdocs mkdocs-material weasyprint wireviz nwdiag bit_field pyinstaller
          pip install -e .
          pyinstaller mkdocs-kit.spec

      - name: Run unit tests
        shell: bash
        run: |
          source .venv/bin/activate
          python3 -m unittest tests/test_all.py

      - name: Test precompiled binary
        run: |
          ./dist/mkdocs-kit --help

      - name: Create Debian Package
        if: matrix.pkg_type == 'deb'
        run: |
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/bin
          cp dist/mkdocs-kit pkg/usr/bin/
          cp packaging/debian/control pkg/DEBIAN/
          chmod 755 pkg/usr/bin/mkdocs-kit
          chmod 644 pkg/DEBIAN/control
          chown -R root:root pkg/
          dpkg-deb --build pkg mkdocs-kit_1.0.0-1_${{ matrix.dist }}_amd64.deb

      - name: Create Arch Linux Package
        if: matrix.pkg_type == 'arch'
        run: |
          cp dist/mkdocs-kit packaging/arch/
          useradd -m builduser
          passwd -d builduser
          printf 'builduser ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builduser
          chown -R builduser:builduser packaging/arch
          cd packaging/arch
          sudo -u builduser makepkg --nodeps --cleanbuild
          mv mkdocs-kit-1.0.0-1-x86_64.pkg.tar.zst ../../mkdocs-kit_1.0.0-1_archlinux.pkg.tar.zst

      - name: Create Fedora Package
        if: matrix.pkg_type == 'rpm'
        run: |
          mkdir -p output
          rpmbuild --define "_sourcedir $PWD/dist" \
                   --define "_rpmdir $PWD/output" \
                   -bb packaging/fedora/mkdocs-kit.spec
          find output -name "*.rpm" -exec cp {} . \;

      - name: Install and test generated package (Debian)
        if: matrix.pkg_type == 'deb'
        run: |
          apt-get install -y ./mkdocs-kit_1.0.0-1_${{ matrix.dist }}_amd64.deb
          mkdocs-kit --help

      - name: Install and test generated package (Arch Linux)
        if: matrix.pkg_type == 'arch'
        run: |
          pacman -U --noconfirm mkdocs-kit_1.0.0-1_archlinux.pkg.tar.zst
          mkdocs-kit --help

      - name: Install and test generated package (Fedora)
        if: matrix.pkg_type == 'rpm'
        run: |
          dnf install -y ./mkdocs-kit-1.0.0-1.*.rpm
          mkdocs-kit --help

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-kit-${{ matrix.dist }}
          path: |
            *.deb
            *.pkg.tar.zst
            *.rpm
