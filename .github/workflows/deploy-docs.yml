name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 default-jre-headless libxml2-dev libxslt1-dev curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Prepare bundled PlantUML
        run: |
          mkdir -p src/mkdocs_kit/bundled/plantuml
          curl -fsSL -o src/mkdocs_kit/bundled/plantuml/plantuml.jar "https://github.com/plantuml/plantuml/releases/download/v1.2024.6/plantuml-asl-1.2024.6.jar" || true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install -e .

      - name: Build Documentation
        run: |
          cd doc
          python3 ../src/mkdocs_kit/cli.py build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
