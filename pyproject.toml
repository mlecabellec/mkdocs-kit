[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-kit"
version = "1.0.0"
description = "A wrapped, highly integrated documentation generation environment."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "weasyprint>=59.0",
    "wireviz>=0.4.1",
    "nwdiag>=3.0.0",
    "bit_field>=1.0.1",
    "pyyaml>=6.0",
]

[project.scripts]
mkdocs-kit = "mkdocs_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
